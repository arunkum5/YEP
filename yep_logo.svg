<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="yep-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C430" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <linearGradient id="yep-tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle line with a clear gap inside (radius 45, no background fill, stroke gold) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#yep-gold)" stroke-width="2.5" />
  
  <!-- "YoungSTAR" in center-top -->
  <text x="50" y="38" font-family="'Rajdhani', sans-serif" font-size="9.5" font-weight="800" fill="url(#yep-tricolor)" text-anchor="middle" letter-spacing="0.5">YoungSTAR</text>
  
  <!-- "EMPOWERMENT" in center -->
  <text x="50" y="52" font-family="'Rajdhani', sans-serif" font-size="6.8" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EMPOWERMENT</text>
  
  <!-- "PARTY" in center-bottom -->
  <text x="50" y="66" font-family="'Rajdhani', sans-serif" font-size="9.5" font-weight="800" fill="url(#yep-gold)" text-anchor="middle" letter-spacing="1">PARTY</text>
</svg>
